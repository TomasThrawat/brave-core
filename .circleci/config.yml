version: 2.1

jobs:
  build-brave-android-arm64-slice:
    parameters:
      segment:
        type: string
      final_segment:
        type: boolean
        default: false
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/brave-workspace
    retention:
      caches: 1d
    environment:
      GIT_CACHE_PATH: /home/circleci/brave-workspace/.circleci-git-cache
      CIRCLECI_PRESERVE_ANDROID_BUILD: "1"
    steps:
      - checkout:
          path: src/brave

      - restore_cache:
          keys:
            - brave-android-out-v2-{{ .Revision }}-

      - restore_cache:
          keys:
            - brave-pnpm-v1-{{ checksum "src/brave/pnpm-lock.yaml" }}
            - brave-pnpm-v1-

      - restore_cache:
          keys:
            - brave-git-cache-v1-{{ .Branch }}-

      - run:
          name: Prepare Linux host and update Git
          command: |
            set -euo pipefail
            OUT_DIR="src/out/android_Static_arm64"
            if [ -f "$OUT_DIR/.circleci-build-complete" ]; then
              echo "APK already completed in an earlier build slice."
              exit 0
            fi

            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y               build-essential ca-certificates curl python3 python-is-python3               software-properties-common xz-utils

            sudo add-apt-repository -y ppa:git-core/ppa
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y git
            GIT_VERSION="$(git --version | awk '{print $3}')"
            echo "Git version: $GIT_VERSION"
            dpkg --compare-versions "$GIT_VERSION" ge "2.46.0"

            if [ ! -f /swapfile ]; then
              sudo fallocate -l 8G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
            fi
            sudo swapon /swapfile || true
            free -h
            df -h /

      - run:
          name: Install Node.js 24 and pnpm
          command: |
            set -euo pipefail
            OUT_DIR="src/out/android_Static_arm64"
            if [ -f "$OUT_DIR/.circleci-build-complete" ]; then
              echo "Skipping toolchain setup; APK is already complete."
              exit 0
            fi

            NODE_VERSION=24.16.0
            NODE_DIST="node-v${NODE_VERSION}-linux-x64"
            mkdir -p "$HOME/.local"
            curl --retry 5 --retry-all-errors -fsSL               "https://nodejs.org/dist/v${NODE_VERSION}/${NODE_DIST}.tar.xz"               -o /tmp/node.tar.xz
            tar -xJf /tmp/node.tar.xz -C "$HOME/.local"
            echo "export PATH=\"$HOME/.local/${NODE_DIST}/bin:\$PATH\"" >> "$BASH_ENV"
            source "$BASH_ENV"
            npm install --global pnpm@11.11.0
            test "$(node --version)" = "v${NODE_VERSION}"
            pnpm --version

      - run:
          name: Install locked Brave JavaScript dependencies
          command: |
            set -euo pipefail
            OUT_DIR="src/out/android_Static_arm64"
            if [ -f "$OUT_DIR/.circleci-build-complete" ]; then
              echo "Skipping pnpm install; APK is already complete."
              exit 0
            fi

            source "$BASH_ENV"
            cd src/brave
            pnpm install --offline --frozen-lockfile --yes

      - run:
          name: Initialize Brave and Chromium Android sources (shallow history)
          command: |
            set -euo pipefail
            OUT_DIR="src/out/android_Static_arm64"
            if [ -f "$OUT_DIR/.circleci-build-complete" ]; then
              echo "Skipping source sync; APK is already complete."
              exit 0
            fi

            source "$BASH_ENV"
            cd src/brave
            node ./build/commands/scripts/sync.ts               --init --target_os=android --target_arch=arm64 --no-history
          no_output_timeout: 30m

      - run:
          name: Install Android build dependencies
          command: |
            set -euo pipefail
            OUT_DIR="src/out/android_Static_arm64"
            if [ -f "$OUT_DIR/.circleci-build-complete" ]; then
              echo "Skipping Android dependencies; APK is already complete."
              exit 0
            fi

            sudo DEBIAN_FRONTEND=noninteractive               ./src/build/install-build-deps.sh --android
          no_output_timeout: 30m

      - run:
          name: Build Brave Android ARM64 APK (slice << parameters.segment >>)
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            OUT_DIR="src/out/android_Static_arm64"
            ARTIFACT_DIR="src/.brave-artifacts"
            mkdir -p "$OUT_DIR" "$ARTIFACT_DIR"
            rm -f "$ARTIFACT_DIR/BUILD_INCOMPLETE.txt"               "$ARTIFACT_DIR/BUILD_FAILED.txt"

            if [ -f "$OUT_DIR/.circleci-build-complete" ]; then
              echo "APK already complete; this serial slice is a no-op."
              exit 0
            fi

            set +e
            timeout --signal=INT --kill-after=45s 27m               pnpm --dir src/brave run build                 --target_os=android                 --target_arch=arm64                 --target_android_output_format=apk
            BUILD_STATUS=$?
            set -e

            if [ "$BUILD_STATUS" -eq 0 ]; then
              mapfile -d '' packages < <(
                find src/out -type f ( -iname '*.apk' -o -iname '*.aab' ) -print0
              )
              if [ "${#packages[@]}" -eq 0 ]; then
                printf 'Build command succeeded, but no APK/AAB was found.\n'                   > "$ARTIFACT_DIR/BUILD_FAILED.txt"
                printf '2\n' > "$OUT_DIR/.circleci-build-failed"
              else
                cp --parents "${packages[@]}" "$ARTIFACT_DIR/"
                sha256sum "${packages[@]}" > "$ARTIFACT_DIR/SHA256SUMS.txt"

                # Keep only the completion marker and APK artifacts in later
                # slices; compiled objects are no longer needed after success.
                rm -rf "$OUT_DIR"
                mkdir -p "$OUT_DIR"
                touch "$OUT_DIR/.circleci-build-complete"
                echo "Brave Android ARM64 APK build completed."
              fi
            elif [ "$BUILD_STATUS" -eq 124 ]; then
              printf 'Slice << parameters.segment >> ended at its 27-minute checkpoint; Ninja outputs are cached for the next slice.\n'                 > "$ARTIFACT_DIR/BUILD_INCOMPLETE.txt"
              echo "Ninja state preserved; the next serial job will resume."
            else
              printf '%s\n' "$BUILD_STATUS" > "$OUT_DIR/.circleci-build-failed"
              printf 'APK build exited with status %s in slice << parameters.segment >>.\n'                 "$BUILD_STATUS" > "$ARTIFACT_DIR/BUILD_FAILED.txt"
              echo "Build failed with status $BUILD_STATUS; preserving outputs for diagnosis."
            fi
          no_output_timeout: 35m

      - save_cache:
          key: brave-android-out-v2-{{ .Revision }}-{{ .BuildNum }}
          paths:
            - src/out/android_Static_arm64
            - src/.brave-artifacts

      - store_artifacts:
          path: src/.brave-artifacts
          destination: brave-android-arm64-segment-<< parameters.segment >>

      - run:
          name: Verify build segment << parameters.segment >>
          command: |
            set -euo pipefail
            OUT_DIR="src/out/android_Static_arm64"
            ARTIFACT_DIR="src/.brave-artifacts"

            if [ -f "$OUT_DIR/.circleci-build-failed" ]; then
              cat "$ARTIFACT_DIR/BUILD_FAILED.txt"
              exit "$(cat "$OUT_DIR/.circleci-build-failed")"
            fi

            if [ "<< parameters.final_segment >>" = "true" ]               && [ ! -f "$OUT_DIR/.circleci-build-complete" ]; then
              echo "The configured 16 free build slices ended before APK completion."
              echo "The latest Ninja output cache and progress remain saved."
              exit 1
            fi

            if [ -f "$OUT_DIR/.circleci-build-complete" ]; then
              echo "Verified: Brave Android ARM64 APK is complete."
            else
              echo "Verified: partial Ninja outputs were saved for the next slice."
            fi

workflows:
  brave-android-arm64:
    jobs:
      - build-brave-android-arm64-slice:
          name: brave-android-arm64-01
          segment: "01"
          final_segment: false
          filters:
            branches:
              only: master
      - build-brave-android-arm64-slice:
          name: brave-android-arm64-02
          segment: "02"
          final_segment: false
          requires:
            - brave-android-arm64-01
