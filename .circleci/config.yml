version: 2.1
jobs:
  prepare-brave-android-arm64:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/brave-workspace
    retention:
      caches: 1d
    environment:
      GIT_CACHE_PATH: /home/circleci/brave-workspace/.circleci-git-cache
      DEPOT_TOOLS_COLLECT_METRICS: '0'
      CIRCLECI_PRESERVE_ANDROID_BUILD: '1'
    steps:
    - run:
        name: Prepare checkout directory
        command: mkdir -p src/brave
    - checkout:
        path: src/brave
    - restore_cache:
        keys:
        - brave-git-cache-v2-{{ .Branch }}-
        - brave-git-cache-v1-{{ .Branch }}-
    - restore_cache:
        keys:
        - brave-pnpm-v1-{{ checksum "src/brave/pnpm-lock.yaml" }}
        - brave-pnpm-v1-
    - run:
        name: Prepare Linux build host
        command: "set -euo pipefail\nsudo apt-get update\nsudo DEBIAN_FRONTEND=noninteractive apt-get install -y \\\n  build-essential\
          \ curl python3 python-is-python3 xz-utils\n\nGIT_VERSION=\"$(git --version | awk '{print $3}')\"\necho \"Git version:\
          \ $GIT_VERSION\"\nif ! dpkg --compare-versions \"$GIT_VERSION\" ge \"2.41.0\"; then\n  sudo DEBIAN_FRONTEND=noninteractive\
          \ apt-get install -y git\n  GIT_VERSION=\"$(git --version | awk '{print $3}')\"\nfi\ndpkg --compare-versions \"\
          $GIT_VERSION\" ge \"2.41.0\"\n\nif [ ! -f /swapfile ]; then\n  sudo fallocate -l 8G /swapfile\n  sudo chmod 600\
          \ /swapfile\n  sudo mkswap /swapfile\nfi\nsudo swapon /swapfile || true\nfree -h\ndf -h /"
    - run:
        name: Install Node.js 24 and pnpm
        command: "set -euo pipefail\nNODE_VERSION=24.16.0\nNODE_DIST=\"node-v$NODE_VERSION-linux-x64\"\nmkdir -p \"$HOME/.local\"\
          \ncurl --retry 5 --retry-all-errors -fsSL \\\n  \"https://nodejs.org/dist/v$NODE_VERSION/$NODE_DIST.tar.xz\" \\\n\
          \  -o /tmp/node.tar.xz\ntar -xJf /tmp/node.tar.xz -C \"$HOME/.local\"\nprintf 'export PATH=\"%s/bin:$PATH\"\\n'\
          \ \"$HOME/.local/$NODE_DIST\" >> \"$BASH_ENV\"\nsource \"$BASH_ENV\"\nnpm install --global pnpm@11.11.0\ntest \"\
          $(node --version)\" = \"v$NODE_VERSION\"\npnpm --version"
    - run:
        name: Install locked Brave JavaScript dependencies
        command: 'set -euo pipefail

          source "$BASH_ENV"

          cd src/brave

          pnpm install --offline --frozen-lockfile --yes'
    - save_cache:
        key: brave-pnpm-v1-{{ checksum "src/brave/pnpm-lock.yaml" }}
        paths:
        - ~/.local/share/pnpm/store
    - run:
        name: Initialize Brave and Chromium Android sources
        command: "set -euo pipefail\nsource \"$BASH_ENV\"\ncd src/brave\nnode ./build/commands/scripts/sync.ts \\\n  --init\
          \ --target_os=android --target_arch=arm64 --no-history"
        no_output_timeout: 30m
    - run:
        name: Install Android build dependencies
        command: "set -euo pipefail\nsudo DEBIAN_FRONTEND=noninteractive \\\n  ./src/build/install-build-deps.sh --android"
        no_output_timeout: 30m
    - save_cache:
        key: brave-git-cache-v2-{{ .Branch }}-{{ .BuildNum }}
        paths:
        - .circleci-git-cache
    - save_cache:
        key: brave-source-v1-{{ .Revision }}
        paths:
        - src
        - .gclient
  build-brave-android-arm64-slice:
    parameters:
      segment:
        type: string
      final_segment:
        type: boolean
        default: false
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/brave-workspace
    retention:
      caches: 1d
    environment:
      CIRCLECI_PRESERVE_ANDROID_BUILD: '1'
    steps:
    - restore_cache:
        keys:
        - brave-source-v1-{{ .Revision }}
    - restore_cache:
        keys:
        - brave-android-out-v3-{{ .Revision }}-
        - brave-android-out-v2-{{ .Revision }}-
    - restore_cache:
        keys:
        - brave-pnpm-v1-{{ checksum "src/brave/pnpm-lock.yaml" }}
        - brave-pnpm-v1-
    - run:
        name: Prepare Linux and Android build dependencies
        command: "set -euo pipefail\nOUT_DIR=\"src/out/android_Static_arm64\"\nif [ -f \"$OUT_DIR/.circleci-build-complete\"\
          \ ]; then\n  echo \"APK already complete; skipping host dependency setup.\"\n  exit 0\nfi\n\nsudo apt-get update\n\
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \\\n  build-essential curl python3 python-is-python3 xz-utils\n\
          \nGIT_VERSION=\"$(git --version | awk '{print $3}')\"\ndpkg --compare-versions \"$GIT_VERSION\" ge \"2.41.0\"\n\n\
          if [ ! -f /swapfile ]; then\n  sudo fallocate -l 8G /swapfile\n  sudo chmod 600 /swapfile\n  sudo mkswap /swapfile\n\
          fi\nsudo swapon /swapfile || true\nsudo DEBIAN_FRONTEND=noninteractive \\\n  ./src/build/install-build-deps.sh --android\n\
          free -h\ndf -h /"
        no_output_timeout: 30m
    - run:
        name: Install Node.js 24 and pnpm
        command: "set -euo pipefail\nOUT_DIR=\"src/out/android_Static_arm64\"\nif [ -f \"$OUT_DIR/.circleci-build-complete\"\
          \ ]; then\n  echo \"APK already complete; skipping Node.js setup.\"\n  exit 0\nfi\n\nNODE_VERSION=24.16.0\nNODE_DIST=\"\
          node-v$NODE_VERSION-linux-x64\"\nmkdir -p \"$HOME/.local\"\ncurl --retry 5 --retry-all-errors -fsSL \\\n  \"https://nodejs.org/dist/v$NODE_VERSION/$NODE_DIST.tar.xz\"\
          \ \\\n  -o /tmp/node.tar.xz\ntar -xJf /tmp/node.tar.xz -C \"$HOME/.local\"\nprintf 'export PATH=\"%s/bin:$PATH\"\
          \\n' \"$HOME/.local/$NODE_DIST\" >> \"$BASH_ENV\"\nsource \"$BASH_ENV\"\nnpm install --global pnpm@11.11.0\ntest\
          \ \"$(node --version)\" = \"v$NODE_VERSION\"\npnpm --version"
    - run:
        name: Verify locked Brave JavaScript dependencies
        command: "set -euo pipefail\nOUT_DIR=\"src/out/android_Static_arm64\"\nif [ -f \"$OUT_DIR/.circleci-build-complete\"\
          \ ]; then\n  echo \"APK already complete; skipping pnpm verification.\"\n  exit 0\nfi\n\nsource \"$BASH_ENV\"\n\
          cd src/brave\npnpm install --offline --frozen-lockfile --yes"
    - run:
        name: Build Brave Android ARM64 APK (slice << parameters.segment >>)
        command: "set -euo pipefail\nsource \"$BASH_ENV\"\nOUT_DIR=\"src/out/android_Static_arm64\"\nARTIFACT_DIR=\"src/.brave-artifacts\"\
          \nBUILD_LOG=\"$ARTIFACT_DIR/brave-android-arm64-<< parameters.segment >>.log\"\nmkdir -p \"$OUT_DIR\" \"$ARTIFACT_DIR\"\
          \n\nif [ -f \"$OUT_DIR/.circleci-build-complete\" ]; then\n  printf \"APK already complete; this serial slice is\
          \ a no-op.\\n\" > \"$BUILD_LOG\"\n  exit 0\nfi\n\nset +e\npython3 src/brave/.circleci/run_build_slice.py \\\n  --timeout-seconds\
          \ 2700 -- \\\n  pnpm --dir src/brave run build \\\n    --target_os=android \\\n    --target_arch=arm64 \\\n    --target_android_output_format=apk\
          \ \\\n  2>&1 | tee \"$BUILD_LOG\"\nBUILD_STATUS=$?\nset -e\n\nif [ \"$BUILD_STATUS\" -ne 0 ]; then\n  printf '%s\\\
          \\n' \"$BUILD_STATUS\" > \"$OUT_DIR/.circleci-build-failed\"\n  echo \"Brave Android build failed before the planned\
          \ checkpoint (status $BUILD_STATUS).\"\n  exit \"$BUILD_STATUS\"\nfi\n\nif grep -q \"BUILD_SLICE_CHECKPOINT_REACHED\"\
          \ \"$BUILD_LOG\"; then\n  printf 'Slice << parameters.segment >> reached its 45-minute checkpoint.\\\\n' \\\n  \
          \  > \"$ARTIFACT_DIR/BUILD_INCOMPLETE_<< parameters.segment >>.txt\"\n  echo \"Incremental Ninja outputs will be\
          \ saved for the next slice.\"\nelse\n  PACKAGE_LIST=\"$ARTIFACT_DIR/packages-<< parameters.segment >>.list\"\n \
          \ find src/out -type f \\( -iname '*.apk' -o -iname '*.aab' \\) \\\n    -print0 > \"$PACKAGE_LIST\"\n\n  if [ !\
          \ -s \"$PACKAGE_LIST\" ]; then\n    echo \"Build command completed without producing an APK/AAB.\"\n    exit 2\n\
          \  fi\n\n  mkdir -p \"$ARTIFACT_DIR/apks\"\n  while IFS= read -r -d '' package; do\n    cp --parents \"$package\"\
          \ \"$ARTIFACT_DIR/apks/\"\n  done < \"$PACKAGE_LIST\"\n  xargs -0 sha256sum < \"$PACKAGE_LIST\" > \"$ARTIFACT_DIR/SHA256SUMS.txt\"\
          \n  touch \"$OUT_DIR/.circleci-build-complete\"\n  echo \"Brave Android ARM64 APK build completed.\"\nfi"
        no_output_timeout: 10m
    - save_cache:
        key: brave-android-out-v3-{{ .Revision }}-{{ .BuildNum }}
        paths:
        - src/out/android_Static_arm64
    - store_artifacts:
        path: src/.brave-artifacts
        destination: brave-android-arm64-segment-<< parameters.segment >>
    - run:
        name: Verify build segment << parameters.segment >>
        command: "set -euo pipefail\nOUT_DIR=\"src/out/android_Static_arm64\"\n\nif [ -f \"$OUT_DIR/.circleci-build-failed\"\
          \ ]; then\n  echo \"A previous build failure marker exists in the restored output.\"\n  exit 1\nfi\n\nif [ \"<<\
          \ parameters.final_segment >>\" = \"true\" ] \\\n  && [ ! -f \"$OUT_DIR/.circleci-build-complete\" ]; then\n  echo\
          \ \"The configured 12 free build slices ended before APK completion.\"\n  echo \"The latest Ninja output cache has\
          \ been saved for continuation.\"\n  exit 1\nfi\n\nif [ -f \"$OUT_DIR/.circleci-build-complete\" ]; then\n  echo\
          \ \"Verified: Brave Android ARM64 APK is complete.\"\nelse\n  echo \"Verified: Ninja outputs were saved for the\
          \ next serial slice.\"\nfi"
job-groups:
  brave-android-arm64-build:
    jobs:
    - prepare-brave-android-arm64
    - build-brave-android-arm64-slice:
        name: brave-android-arm64-01
        segment: '01'
        final_segment: false
        requires:
        - prepare-brave-android-arm64
    - build-brave-android-arm64-slice:
        name: brave-android-arm64-02
        segment: '02'
        final_segment: false
        requires:
        - brave-android-arm64-01
    - build-brave-android-arm64-slice:
        name: brave-android-arm64-03
        segment: '03'
        final_segment: false
        requires:
        - brave-android-arm64-02
    - build-brave-android-arm64-slice:
        name: brave-android-arm64-04
        segment: '04'
        final_segment: false
        requires:
        - brave-android-arm64-03
    - build-brave-android-arm64-slice:
        name: brave-android-arm64-05
        segment: '05'
        final_segment: false
        requires:
        - brave-android-arm64-04
    - build-brave-android-arm64-slice:
        name: brave-android-arm64-06
        segment: '06'
        final_segment: false
        requires:
        - brave-android-arm64-05
    - build-brave-android-arm64-slice:
        name: brave-android-arm64-07
        segment: '07'
        final_segment: false
        requires:
        - brave-android-arm64-06
    - build-brave-android-arm64-slice:
        name: brave-android-arm64-08
        segment: 08
        final_segment: false
        requires:
        - brave-android-arm64-07
    - build-brave-android-arm64-slice:
        name: brave-android-arm64-09
        segment: 09
        final_segment: false
        requires:
        - brave-android-arm64-08
    - build-brave-android-arm64-slice:
        name: brave-android-arm64-10
        segment: '10'
        final_segment: false
        requires:
        - brave-android-arm64-09
    - build-brave-android-arm64-slice:
        name: brave-android-arm64-11
        segment: '11'
        final_segment: false
        requires:
        - brave-android-arm64-10
    - build-brave-android-arm64-slice:
        name: brave-android-arm64-12
        segment: '12'
        final_segment: true
        requires:
        - brave-android-arm64-11
workflows:
  brave-android-arm64:
    jobs:
    - brave-android-arm64-build:
        serial-group: << pipeline.project.slug >>/brave-android-arm64
        filters:
          branches:
            only: master
